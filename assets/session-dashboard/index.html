<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACGM · 上下文余量</title>
<style>
:root{color-scheme:dark;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101416;color:#edf2f4}body{margin:0;padding:30px 22px;max-width:850px;margin:auto}header{border-bottom:1px solid #30383c;padding-bottom:20px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#91a3ac}h1{font-size:25px;margin:7px 0}p{margin:8px 0;color:#9aaab2}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:16px}.card{background:#192024;border:1px solid #303b41;border-radius:14px;padding:20px;margin-bottom:18px;--accent:#5fdbac}.head{display:flex;justify-content:space-between;gap:20px}h2{font-size:14px;font-weight:500;margin:0;max-width:72%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.badge{color:var(--accent);white-space:nowrap;font-size:12px}.numbers{display:flex;align-items:baseline;gap:10px;margin:20px 0 12px}.number{font-size:35px;line-height:1.1;letter-spacing:-1px}.track{height:13px;background:#303c42;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .5s;width:0}.facts{display:flex;justify-content:space-between;font-size:12px;color:#acb8be;margin:10px 0}.hint{font-size:13px}.id{font:10px ui-monospace,monospace;color:#84939b;margin-top:16px}.footer{font-size:12px;color:#87979f}#connection{font-size:12px}button{background:#293940;color:#eaf3f5;border:1px solid #50646e;border-radius:6px;padding:5px 10px;cursor:pointer}a{color:#b1cadd}
</style>
<header><div class="eyebrow">ACGM / SESSION GUARDIAN</div><h1>上下文余量</h1><p id="project">连接本机任务…</p><div class="legend"><span style="color:#5fdbac">● 正常</span><span style="color:#ead36c">● 35% 谨慎</span><span style="color:#f4a866">● 20% 收尾</span><span style="color:#fb8189">● 交接确认</span></div></header>
<div id="connection" role="status">读取中</div><main id="cards"></main><p class="footer">每 3 秒自动读取本机记录。显示的是最近一次上下文估计，不是累计计费 token；暂停超过 5 分钟会变灰。卡片对应指定项目的任务，不会跟随你切换聊天窗口。</p>
<script>
const colors={NORMAL:'#5fdbac',CAUTION:'#ead36c',CLOSING:'#f4a866',CONFIRM:'#fb8189',UNKNOWN:'#87979f'};
const labels={NORMAL:'正常工作',CAUTION:'谨慎安排',CLOSING:'建议收尾',CONFIRM:'需要交接确认',UNKNOWN:'数据待更新'};
const hints={NORMAL:'可以继续工作，留意下一阶段的余量。',CAUTION:'建议不要开启大型新任务。',CLOSING:'建议下一步收尾交接，将后续工作放到新任务。',CONFIRM:'请在原任务回复「ACGM 交接」。',UNKNOWN:'没有新鲜、可验证的记录；灰色不代表还有足够空间。'};
const cards=document.getElementById('cards'),nodes=new Map();
function node(tag,cls,text){const n=document.createElement(tag);n.className=cls;n.textContent=text;return n}
function render(data){document.getElementById('project').textContent=data.project+' · 最近未归档任务';
const seen=new Set();for(const t of data.tasks){seen.add(t.id);let c=nodes.get(t.id);if(!c){c=node('section','card','');nodes.set(t.id,c);cards.append(c)}c.replaceChildren();c.style.setProperty('--accent',colors[t.stage]);const h=node('div','head','');h.append(node('h2','',t.title),node('span','badge',labels[t.stage]));c.append(h);
const n=node('div','numbers','');n.append(node('span','number',t.stage==='UNKNOWN'?'—':t.remaining_percent+'%'),node('span','','剩余'));c.append(n);
const track=node('div','track',''),fill=node('div','fill','');fill.style.width=(t.stage==='UNKNOWN'?0:Math.max(0,Math.min(100,t.remaining_percent)))+'%';track.append(fill);track.setAttribute('role','progressbar');track.setAttribute('aria-label','上下文剩余');if(t.stage!=='UNKNOWN')track.setAttribute('aria-valuenow',t.remaining_percent);track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');c.append(track);
const facts=node('div','facts','');facts.append(node('span','',t.context_used?'最近已用 '+Math.round(t.context_used/1000)+'K':'尚无用量'),node('span','',t.context_window?'有效窗口 '+Math.round(t.context_window/1000)+'K':''));c.append(facts,node('p','hint',hints[t.stage]));if(t.window_matches===false)c.append(node('p','hint','窗口配置尚未体现在此旧任务中；请用新任务验证 500K。'));if(t.compactions_in_observed_tail)c.append(node('p','hint','所读记录中发现压缩事件，需核对交接状态。'));
const age=t.observed_at?Math.max(0,Math.round(Date.now()/1000-t.observed_at)):null;c.append(node('div','id',t.id+(age===null?'':' · 样本 '+age+' 秒前')));}
for(const [id,c] of nodes)if(!seen.has(id)){c.remove();nodes.delete(id)}if(!data.tasks.length)cards.textContent='这个项目暂时没有可显示的任务。';}
async function update(){try{const r=await fetch('status',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error();const d=await r.json();if(d.error)throw Error();render(d);document.getElementById('connection').textContent='● 本机已连接 · '+new Date().toLocaleTimeString();}catch(e){document.getElementById('connection').textContent='连接中断，下面是旧数据，请勿据此判断余量。';for(const c of nodes.values()){c.style.setProperty('--accent',colors.UNKNOWN);c.querySelector('.badge').textContent='连接中断';c.querySelector('.number').textContent='—';c.querySelector('.fill').style.width='0%';}}finally{setTimeout(update,3000)}}update();
</script></html>
